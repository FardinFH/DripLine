<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | DripLine</title>

  <link rel="stylesheet" href="login.css" />
</head>

<body>

<section class="login-page">
  <div class="login-card">

    <a href="index.html" class="brand">
      <img src="logo.jpg" alt="DripLine Logo" />
      <span>DripLine</span>
    </a>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to continue shopping your clean fits.
    </p>

    <div class="demo-notice">
      <strong>Demo Website:</strong>
      Login using your registered email and password
      <strong>123456</strong>.
    </div>

    <div class="success-message" id="successMessage">
      Login successful! Redirecting...
    </div>

    <form id="loginForm">

      <div class="input-group">
        <label for="emailInput">Email Address</label>

        <input
          type="email"
          id="emailInput"
          placeholder="Enter your registered email"
          autocomplete="email"
          required
        />
      </div>

      <div class="input-group password-group">
        <label for="passwordInput">Password</label>

        <div class="password-box">
          <input
            type="password"
            id="passwordInput"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

          <button type="button" id="togglePassword">
            Show
          </button>
        </div>
      </div>

      <div class="form-options">

        <label class="remember">
          <input type="checkbox" id="rememberMe" />
          Remember me
        </label>

        <a href="forgot-password.html">
          Forgot password?
        </a>

      </div>

      <p class="error-message" id="errorMessage"></p>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <p class="register-text">
      Don’t have an account?
      <a href="registration.html">Create account</a>
    </p>

  </div>
</section>

<script>
  const loginForm = document.getElementById("loginForm");
  const emailInput = document.getElementById("emailInput");
  const passwordInput = document.getElementById("passwordInput");
  const togglePassword = document.getElementById("togglePassword");
  const rememberMe = document.getElementById("rememberMe");
  const errorMessage = document.getElementById("errorMessage");
  const successMessage = document.getElementById("successMessage");

  /*
   * Show or hide password
   */
  togglePassword.addEventListener("click", function () {
    const isPasswordHidden = passwordInput.type === "password";

    passwordInput.type = isPasswordHidden ? "text" : "password";
    togglePassword.textContent = isPasswordHidden ? "Hide" : "Show";
  });

  /*
   * Fill recently registered or remembered email
   */
  window.addEventListener("DOMContentLoaded", function () {
    const rememberedEmail = localStorage.getItem("driplineRememberedEmail");
    const recentEmail = localStorage.getItem("driplineRecentEmail");

    if (rememberedEmail) {
      emailInput.value = rememberedEmail;
      rememberMe.checked = true;
    } else if (recentEmail) {
      emailInput.value = recentEmail;
    }

    /*
     * Redirect if the user is already logged in
     */
    const localLogin = localStorage.getItem("driplineLoggedIn");
    const sessionLogin = sessionStorage.getItem("driplineLoggedIn");

    if (localLogin === "true" || sessionLogin === "true") {
      window.location.href = "index.html";
    }
  });

  /*
   * Login form submission
   */
  loginForm.addEventListener("submit", function (event) {
    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    errorMessage.textContent = "";
    successMessage.style.display = "none";

    if (email === "" || password === "") {
      errorMessage.textContent = "Please enter your email and password.";
      return;
    }

    /*
     * Read registered users from localStorage
     */
    let users = [];

    try {
      const savedUsers = localStorage.getItem("driplineUsers");

      users = savedUsers ? JSON.parse(savedUsers) : [];

      if (!Array.isArray(users)) {
        users = [];
      }
    } catch (error) {
      users = [];
    }

    /*
     * Check if any user has registered
     */
    if (users.length === 0) {
      errorMessage.textContent =
        "No registered account found. Please create an account first.";

      return;
    }

    /*
     * Find user by email
     */
    const registeredUser = users.find(function (user) {
      return (
        String(user.email).toLowerCase() === email &&
        String(user.password) === password
      );
    });

    /*
     * Invalid email or password
     */
    if (!registeredUser) {
      errorMessage.textContent =
        "Invalid email or password. Demo password is 123456.";

      return;
    }

    /*
     * Do not store password in current user information
     */
    const currentUser = {
      id: registeredUser.id,
      userName: registeredUser.userName,
      address: registeredUser.address,
      birthDate: registeredUser.birthDate,
      phone: registeredUser.phone,
      email: registeredUser.email,
      registrationDate: registeredUser.registrationDate,
      loginTime: new Date().toISOString()
    };

    /*
     * Save logged-in user information
     */
    localStorage.setItem(
      "driplineCurrentUser",
      JSON.stringify(currentUser)
    );

    /*
     * Remember-me login system
     */
    if (rememberMe.checked) {
      localStorage.setItem("driplineLoggedIn", "true");
      localStorage.setItem("driplineRememberedEmail", email);

      sessionStorage.removeItem("driplineLoggedIn");
    } else {
      sessionStorage.setItem("driplineLoggedIn", "true");

      localStorage.removeItem("driplineLoggedIn");
      localStorage.removeItem("driplineRememberedEmail");
    }

    localStorage.removeItem("driplineRecentEmail");

    successMessage.style.display = "block";
    errorMessage.textContent = "";

    loginForm.reset();

    setTimeout(function () {
      window.location.href = "index.html";
    }, 1200);
  });
</script>

</body>
</html>
