<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | DripLine</title>
  <link rel="stylesheet" href="forgot-password.css" />
</head>
<body>

<section class="forgot-page">
  <div class="forgot-card">

    <a href="index.html" class="brand">
      <img src="logo.jpg" alt="DripLine Logo" />
      <span>DripLine</span>
    </a>

    <h1>Reset Password</h1>
    <p class="subtitle">Enter your registered email or phone number first.</p>

    <div class="success-message" id="successMessage"></div>
    <div class="error-message" id="errorMessage"></div>

    <form id="checkForm">
      <div class="input-group">
        <label>Email or Phone Number</label>
        <input type="text" id="userCheck" placeholder="Enter email or phone" required />
      </div>

      <button type="submit" class="main-btn">Check Account</button>
    </form>

    <form id="resetForm" class="hidden">
      <div class="input-group">
        <label>New Password</label>
        <div class="password-box">
          <input type="password" id="newPassword" placeholder="Enter new password" required />
          <button type="button" id="toggleNewPass">Show</button>
        </div>
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <div class="password-box">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
          <button type="button" id="toggleConfirmPass">Show</button>
        </div>
      </div>

      <button type="submit" class="main-btn">Update Password</button>
    </form>

    <p class="login-text">
      Remember password?
      <a href="login.html">Login</a>
    </p>

  </div>
</section>

<script>
  const checkForm = document.getElementById("checkForm");
  const resetForm = document.getElementById("resetForm");
  const userCheck = document.getElementById("userCheck");

  const errorMessage = document.getElementById("errorMessage");
  const successMessage = document.getElementById("successMessage");

  const newPassword = document.getElementById("newPassword");
  const confirmPassword = document.getElementById("confirmPassword");

  const toggleNewPass = document.getElementById("toggleNewPass");
  const toggleConfirmPass = document.getElementById("toggleConfirmPass");

  let matchedUserIndex = null;

  toggleNewPass.addEventListener("click", function () {
    const hidden = newPassword.type === "password";
    newPassword.type = hidden ? "text" : "password";
    toggleNewPass.textContent = hidden ? "Hide" : "Show";
  });

  toggleConfirmPass.addEventListener("click", function () {
    const hidden = confirmPassword.type === "password";
    confirmPassword.type = hidden ? "text" : "password";
    toggleConfirmPass.textContent = hidden ? "Hide" : "Show";
  });

  checkForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const value = userCheck.value.trim().toLowerCase();
    const users = JSON.parse(localStorage.getItem("driplineUsers")) || [];

    errorMessage.textContent = "";
    successMessage.textContent = "";

    matchedUserIndex = users.findIndex(function (user) {
      return user.email === value || user.phone === value;
    });

    if (matchedUserIndex === -1) {
      errorMessage.textContent = "No account found with this email or phone number.";
      resetForm.classList.add("hidden");
      return;
    }

    successMessage.textContent = "Account found. Please set your new password.";
    checkForm.classList.add("hidden");
    resetForm.classList.remove("hidden");
  });

  resetForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const pass = newPassword.value;
    const confirmPass = confirmPassword.value;

    errorMessage.textContent = "";
    successMessage.textContent = "";

    if (pass !== confirmPass) {
      errorMessage.textContent = "New password and confirm password do not match.";
      return;
    }

    if (pass.length < 6) {
      errorMessage.textContent = "Password must be at least 6 characters.";
      return;
    }

    let users = JSON.parse(localStorage.getItem("driplineUsers")) || [];

    if (matchedUserIndex === null || !users[matchedUserIndex]) {
      errorMessage.textContent = "Something went wrong. Please try again.";
      return;
    }

    users[matchedUserIndex].password = pass;
    localStorage.setItem("driplineUsers", JSON.stringify(users));

    successMessage.textContent = "Password updated successfully! Redirecting to login...";
    resetForm.reset();

    setTimeout(function () {
      window.location.href = "login.html";
    }, 1800);
  });
</script>

</body>
</html>
